[package]
name = "clickerd"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Input sequencer for the Noctalia Clicker plugin"
repository = "https://github.com/C010UR/noctalia-clicker"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
strip = true
