id = "c010ur/clicker"
name = "Clicker"
version = "1.2.1"
plugin_api = 43
author = "c010ur"
license = "MIT"
icon = "click"
description = "Autoclicker, macro engine, and Terraria Fisher with focus-aware safety."
tags = ["gaming", "utility", "automation"]

[[setting]]
key = "rate"
type = "double"
label_key = "settings.rate.label"
description_key = "settings.rate.description"
default = 12.0
min = 1.0
max = 1000.0
step = 1.0

[[setting]]
key = "rate_unit"
type = "select"
label_key = "settings.rate_unit.label"
description_key = "settings.rate_unit.description"
default = "cps"
options = [
  { value = "cps", label_key = "settings.rate_unit.cps" },
  { value = "cpm", label_key = "settings.rate_unit.cpm" },
]

[[setting]]
key = "action"
type = "select"
label_key = "settings.action.label"
description_key = "settings.action.description"
default = "left"
options = [
  { value = "left", label_key = "settings.action.left" },
  { value = "right", label_key = "settings.action.right" },
  { value = "middle", label_key = "settings.action.middle" },
  { value = "space", label_key = "settings.action.space" },
  { value = "custom", label_key = "settings.action.custom" },
]

[[setting]]
key = "custom_key"
type = "string"
label_key = "settings.custom_key.label"
description_key = "settings.custom_key.description"
default = "space"
visible_when = { key = "action", values = ["custom"] }

[[setting]]
key = "hold_ms"
type = "int"
label_key = "settings.hold_ms.label"
description_key = "settings.hold_ms.description"
default = 20
min = 1
max = 100
step = 1

[[setting]]
key = "jitter_pct"
type = "double"
label_key = "settings.jitter_pct.label"
description_key = "settings.jitter_pct.description"
default = 0.0
min = 0.0
max = 50.0
step = 1.0

[[setting]]
key = "start_delay"
type = "double"
label_key = "settings.start_delay.label"
description_key = "settings.start_delay.description"
default = 3.0
min = 0.0
max = 10.0
step = 0.5

[[setting]]
key = "max_duration"
type = "double"
label_key = "settings.max_duration.label"
description_key = "settings.max_duration.description"
default = 0.0
min = 0.0
max = 86400.0
step = 1.0

[[setting]]
key = "target_app"
type = "string"
label_key = "settings.target_app.label"
description_key = "settings.target_app.description"
default = ""
advanced = true

[[setting]]
key = "stop_on_focus_loss"
type = "bool"
label_key = "settings.stop_on_focus_loss.label"
description_key = "settings.stop_on_focus_loss.description"
default = true
advanced = true

[[setting]]
key = "show_osd"
type = "bool"
label_key = "settings.show_osd.label"
description_key = "settings.show_osd.description"
default = true

[[setting]]
key = "notify"
type = "bool"
label_key = "settings.notify.label"
description_key = "settings.notify.description"
default = true

[[setting]]
key = "helper_path"
type = "file"
label_key = "settings.helper_path.label"
description_key = "settings.helper_path.description"
default = "~/.local/bin/clickerd"
advanced = true

[[setting]]
key = "macro_default_repeat"
type = "int"
label_key = "settings.macro_default_repeat.label"
description_key = "settings.macro_default_repeat.description"
default = 1
min = 0
max = 1000000
step = 1
advanced = true

[[setting]]
key = "macro_default_loop_delay"
type = "int"
label_key = "settings.macro_default_loop_delay.label"
description_key = "settings.macro_default_loop_delay.description"
default = 250
min = 0
max = 60000
step = 50
advanced = true

[[setting]]
key = "macro_max_runtime"
type = "int"
label_key = "settings.macro_max_runtime.label"
description_key = "settings.macro_max_runtime.description"
default = 600
min = 0
max = 86400
step = 30
advanced = true

[[setting]]
key = "fisher_target_app"
type = "string"
label_key = "settings.fisher_target_app.label"
description_key = "settings.fisher_target_app.description"
default = "steam_app_105600"
advanced = true

[[setting]]
key = "fisher_cast_button"
type = "select"
label_key = "settings.fisher_cast_button.label"
description_key = "settings.fisher_cast_button.description"
default = "left"
options = [
  { value = "left", label_key = "settings.fisher_cast_button.left" },
  { value = "right", label_key = "settings.fisher_cast_button.right" },
]

[[setting]]
key = "fisher_press_ms"
type = "int"
label_key = "settings.fisher_press_ms.label"
description_key = "settings.fisher_press_ms.description"
default = 40
min = 5
max = 500
step = 5
advanced = true

[[setting]]
key = "fisher_settle_ms"
type = "int"
label_key = "settings.fisher_settle_ms.label"
description_key = "settings.fisher_settle_ms.description"
default = 1200
min = 0
max = 5000
step = 50

[[setting]]
key = "fisher_bite_timeout"
type = "double"
label_key = "settings.fisher_bite_timeout.label"
description_key = "settings.fisher_bite_timeout.description"
default = 30.0
min = 3.0
max = 300.0
step = 1.0

[[setting]]
key = "fisher_post_reel_ms"
type = "int"
label_key = "settings.fisher_post_reel_ms.label"
description_key = "settings.fisher_post_reel_ms.description"
default = 600
min = 100
max = 5000
step = 50

[[setting]]
key = "fisher_recover_ms"
type = "int"
label_key = "settings.fisher_recover_ms.label"
description_key = "settings.fisher_recover_ms.description"
default = 350
min = 0
max = 5000
step = 50
advanced = true

[[setting]]
key = "fisher_max_casts"
type = "int"
label_key = "settings.fisher_max_casts.label"
description_key = "settings.fisher_max_casts.description"
default = 0
min = 0
max = 1000000
step = 10

[[setting]]
key = "fisher_max_runtime"
type = "int"
label_key = "settings.fisher_max_runtime.label"
description_key = "settings.fisher_max_runtime.description"
default = 0
min = 0
max = 86400
step = 60

[[setting]]
key = "fisher_sensitivity"
type = "double"
label_key = "settings.fisher_sensitivity.label"
description_key = "settings.fisher_sensitivity.description"
default = 0.70
min = 0.1
max = 0.99
step = 0.01

[[setting]]
key = "fisher_min_interval"
type = "int"
label_key = "settings.fisher_min_interval.label"
description_key = "settings.fisher_min_interval.description"
default = 1200
min = 100
max = 10000
step = 50
advanced = true

[[setting]]
key = "fisher_audio_device"
type = "string"
label_key = "settings.fisher_audio_device.label"
description_key = "settings.fisher_audio_device.description"
default = ""
advanced = true

[[setting]]
key = "fisher_template"
type = "file"
label_key = "settings.fisher_template.label"
description_key = "settings.fisher_template.description"
default = ""
advanced = true

[[setting]]
key = "fisher_pitch_variants"
type = "bool"
label_key = "settings.fisher_pitch_variants.label"
description_key = "settings.fisher_pitch_variants.description"
default = true
advanced = true

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "widget"
entry = "widget.luau"

[[widget.setting]]
key = "hide_when_idle"
type = "bool"
label_key = "settings.widget.hide_when_idle.label"
description_key = "settings.widget.hide_when_idle.description"
default = false

[[widget.setting]]
key = "show_rate"
type = "bool"
label_key = "settings.widget.show_rate.label"
description_key = "settings.widget.show_rate.description"
default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 430
height = 640
placement = "attached"
open_near_click = true

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"
